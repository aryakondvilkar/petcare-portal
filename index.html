<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare Portal</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        nav {
            background-color: #0f766e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        nav a.brand {
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
        }
        .nav-links a.btn-cta {
            background-color: white;
            color: #0f766e;
            font-weight: bold;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 5rem 1.5rem;
            background-color: #f8fafc;
            min-height: 80vh;
        }
        .hero h1 {
            font-size: 2.5rem;
            color: #1e293b;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.1rem;
            color: #64748b;
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .hero-buttons a {
            display: inline-block;
            padding: 0.8rem 1.6rem;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin: 0.5rem;
        }
        .btn-primary {
            background-color: #0f766e;
            color: white;
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="brand">🐾 PetCare Portal</a>
        <div class="nav-links">
            <a href="/login">Login</a>
            <a href="/register" class="btn-cta">Sign Up</a>
        </div>
    </nav>

    <div class="hero">
        <h1>All Your Pet's Care in One Place</h1>
        <p>Book appointments, manage medical records, and stay on top of your pet's health with trusted local care providers.</p>
        <div class="hero-buttons">
            <a href="/login" class="btn-primary">Go to Login</a>
            <a href="/register" class="btn-secondary">Create Account</a>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🐾 Reschedule Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; }
        .top-green-panel { background: linear-gradient(135deg, #022c22, #047857); padding: 16px 30px; }
        .card-custom { border-radius: 20px; background: #fff; box-shadow: 0 10px 30px rgba(4,120,87,0.15); }
        .btn-brand { background: #047857; color: #fff; }
        .btn-logout { background-color: #dc2626 !important; color: #fff !important; }
    </style>
</head>
<body>
    <div class="top-green-panel d-flex justify-content-between align-items-center">
        <a href="/dashboard" class="text-white text-decoration-none fw-bold">🐾 PetCare</a>
        <a href="/logout" class="btn btn-logout btn-sm rounded-pill px-3">Logout</a>
    </div>
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom p-4">
                    <h3 class="fw-bold mb-3 text-dark">Reschedule Appointment</h3>
                    <p class="text-muted small">Pet: <strong>{{ booking.pet_name }}</strong> | Service: <strong>{{ booking.service_name }}</strong></p>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">New Date</label>
                            <input type="date" class="form-control rounded-pill px-3" name="booking_date" value="{{ booking.booking_date }}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">New Time Slot</label>
                            <select class="form-select rounded-pill px-3" name="booking_time" required>
                                <option value="09:00 AM">09:00 AM</option>
                                <option value="10:30 AM">10:30 AM</option>
                                <option value="12:00 PM">12:00 PM</option>
                                <option value="02:30 PM">02:30 PM</option>
                                <option value="04:00 PM">04:00 PM</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-brand w-100 rounded-pill py-2 fw-bold">Update Appointment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-white small" style="background: #022c22;">&copy; 2026 PetCare</footer>
</body>
</html>
